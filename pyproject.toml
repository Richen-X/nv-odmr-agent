[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nvagent"
version = "0.1.0"
description = "Closed-loop LLM agent that plans, runs and analyses NV-centre ODMR measurements on a physics simulator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Richen Xiong" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "lmfit>=1.2",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nvagent = "nvagent.orchestrator:main"
nvagent-mcp = "nvagent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nvagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
